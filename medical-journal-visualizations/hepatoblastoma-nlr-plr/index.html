<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NLR & PLR as Predictive Markers in Hepatoblastoma</title>
    <style>
        :root {
            --primary-blue: #2563EB;
            --crimson: #DC2626;
            --slate: #1E293B;
            --amber: #F59E0B;
            --emerald: #10B981;
            --gray: #64748B;
            --white: #F8FAFC;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Inter', 'DM Sans', sans-serif;
            background: var(--white);
            color: var(--slate);
            overflow: hidden;
        }

        /* Slide Container */
        .slideshow {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transform: translateX(100%);
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .slide.active {
            opacity: 1;
            transform: translateX(0);
        }

        .slide.prev {
            transform: translateX(-100%);
        }

        .slide-content {
            max-width: 1400px;
            width: 100%;
            text-align: center;
        }

        .slide img {
            max-width: 100%;
            max-height: 85vh;
            object-fit: contain;
            border-radius: 16px;
            box-shadow: 0 25px 80px rgba(0,0,0,0.15);
            animation: fadeInUp 0.8s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Navigation */
        .nav-controls {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 16px;
            z-index: 100;
            background: rgba(255,255,255,0.95);
            padding: 16px 32px;
            border-radius: 50px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        .nav-btn {
            width: 50px;
            height: 50px;
            border: none;
            border-radius: 50%;
            background: var(--primary-blue);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            font-size: 20px;
        }

        .nav-btn:hover {
            background: var(--slate);
            transform: scale(1.1);
        }

        .nav-btn:disabled {
            background: var(--gray);
            cursor: not-allowed;
            transform: none;
        }

        /* Progress Dots */
        .progress-dots {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--gray);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .dot.active {
            background: var(--primary-blue);
            transform: scale(1.3);
        }

        .dot:hover {
            background: var(--slate);
        }

        /* Slide Counter */
        .slide-counter {
            position: fixed;
            top: 30px;
            right: 40px;
            font-size: 18px;
            font-weight: 600;
            color: var(--slate);
            background: white;
            padding: 12px 24px;
            border-radius: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            z-index: 100;
        }

        .slide-counter span {
            color: var(--primary-blue);
        }

        /* Title Header */
        .title-header {
            position: fixed;
            top: 30px;
            left: 40px;
            z-index: 100;
            text-align: left;
        }

        .title-header h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--slate);
            margin-bottom: 4px;
        }

        .title-header p {
            font-size: 14px;
            color: var(--gray);
        }

        /* Keyboard hint */
        .keyboard-hint {
            position: fixed;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 13px;
            color: var(--gray);
            z-index: 100;
        }

        .keyboard-hint kbd {
            background: #eee;
            padding: 4px 10px;
            border-radius: 6px;
            font-family: monospace;
            margin: 0 4px;
        }

        /* Loading */
        .loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--white);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 0.5s ease;
        }

        .loading.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid #eee;
            border-top-color: var(--primary-blue);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Fullscreen button */
        .fullscreen-btn {
            position: fixed;
            top: 30px;
            right: 180px;
            z-index: 100;
            background: white;
            border: none;
            padding: 12px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: var(--slate);
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            transition: all 0.3s ease;
        }

        .fullscreen-btn:hover {
            background: var(--primary-blue);
            color: white;
        }
    </style>
</head>
<body>
    <!-- Loading -->
    <div class="loading" id="loading">
        <div class="loading-spinner"></div>
    </div>

    <!-- Title Header -->
    <div class="title-header">
        <h1>NLR & PLR in Hepatoblastoma</h1>
        <p>Neutrophil-to-lymphocyte ratio and platelet-to-lymphocyte ratio as predictive markers</p>
    </div>

    <!-- Slide Counter -->
    <div class="slide-counter">
        <span id="current">1</span> / <span id="total">7</span>
    </div>

    <!-- Fullscreen Button -->
    <button class="fullscreen-btn" onclick="toggleFullscreen()">
        ⛶ Fullscreen
    </button>

    <!-- Slideshow -->
    <div class="slideshow" id="slideshow">
        <!-- Slide 1 -->
        <div class="slide active">
            <div class="slide-content">
                <img src="hepato_frame_01_cover.png" alt="Frame 1: Cover & Overview">
            </div>
        </div>

        <!-- Slide 2 -->
        <div class="slide">
            <div class="slide-content">
                <img src="hepato_frame_02_pathophys.png" alt="Frame 2: Pathophysiology">
            </div>
        </div>

        <!-- Slide 3 -->
        <div class="slide">
            <div class="slide-content">
                <img src="hepato_frame_03_design.png" alt="Frame 3: Study Design">
            </div>
        </div>

        <!-- Slide 4 -->
        <div class="slide">
            <div class="slide-content">
                <img src="hepato_frame_04_roc.png" alt="Frame 4: ROC Analysis">
            </div>
        </div>

        <!-- Slide 5 -->
        <div class="slide">
            <div class="slide-content">
                <img src="hepato_frame_05_survival.png" alt="Frame 5: Survival Analysis">
            </div>
        </div>

        <!-- Slide 6 -->
        <div class="slide">
            <div class="slide-content">
                <img src="hepato_frame_06_multivariate.png" alt="Frame 6: Multivariate Analysis">
            </div>
        </div>

        <!-- Slide 7 -->
        <div class="slide">
            <div class="slide-content">
                <img src="hepato_frame_07_conclusion.png" alt="Frame 7: Conclusion">
            </div>
        </div>
    </div>

    <!-- Navigation -->
    <div class="nav-controls">
        <button class="nav-btn" id="prevBtn" onclick="changeSlide(-1)">←</button>
        
        <div class="progress-dots" id="dots"></div>
        
        <button class="nav-btn" id="nextBtn" onclick="changeSlide(1)">→</button>
    </div>

    <!-- Keyboard Hint -->
    <div class="keyboard-hint">
        Use <kbd>←</kbd> <kbd>→</kbd> arrow keys or click dots to navigate
    </div>

    <script>
        let currentSlide = 0;
        const slides = document.querySelectorAll('.slide');
        const totalSlides = slides.length;
        const dotsContainer = document.getElementById('dots');

        // Update total counter
        document.getElementById('total').textContent = totalSlides;

        // Create dots
        for (let i = 0; i < totalSlides; i++) {
            const dot = document.createElement('div');
            dot.className = 'dot' + (i === 0 ? ' active' : '');
            dot.onclick = () => goToSlide(i);
            dotsContainer.appendChild(dot);
        }

        const dots = document.querySelectorAll('.dot');

        function updateSlide() {
            slides.forEach((slide, index) => {
                slide.classList.remove('active', 'prev');
                if (index === currentSlide) {
                    slide.classList.add('active');
                } else if (index < currentSlide) {
                    slide.classList.add('prev');
                }
            });

            dots.forEach((dot, index) => {
                dot.classList.toggle('active', index === currentSlide);
            });

            document.getElementById('current').textContent = currentSlide + 1;
            document.getElementById('prevBtn').disabled = currentSlide === 0;
            document.getElementById('nextBtn').disabled = currentSlide === totalSlides - 1;
        }

        function changeSlide(direction) {
            const newSlide = currentSlide + direction;
            if (newSlide >= 0 && newSlide < totalSlides) {
                currentSlide = newSlide;
                updateSlide();
            }
        }

        function goToSlide(index) {
            currentSlide = index;
            updateSlide();
        }

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') changeSlide(-1);
            if (e.key === 'ArrowRight') changeSlide(1);
            if (e.key === 'f' || e.key === 'F') toggleFullscreen();
        });

        // Fullscreen
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        }

        // Hide loading
        window.onload = () => {
            setTimeout(() => {
                document.getElementById('loading').classList.add('hidden');
            }, 500);
        };

        // Touch/swipe support
        let touchStartX = 0;
        let touchEndX = 0;

        document.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        });

        document.addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        });

        function handleSwipe() {
            const swipeThreshold = 50;
            const diff = touchStartX - touchEndX;
            
            if (Math.abs(diff) > swipeThreshold) {
                if (diff > 0) {
                    changeSlide(1); // Next
                } else {
                    changeSlide(-1); // Prev
                }
            }
        }
    </script>
</body>
</html>
